version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: ueba-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - LANG=C.UTF-8
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - ueba-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: ueba-kibana
    user: "1000:1000"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
      - I18N_LOCALE=fr
    ports:
      - "5601:5601"
    networks:
      - ueba-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: ueba-logstash
    volumes:
      - ../scripts/prod/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    ports:
      - "5000:5000"
      - "5514:5514/udp"
      - "5044:5044"
      - "9600:9600"
    networks:
      - ueba-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  ueba-app:
    build:
      context: ..
      dockerfile: configs/Dockerfile.runtime
    container_name: ueba-app
    working_dir: /app
    volumes:
      - ..:/app
    networks:
      - ueba-network
    depends_on:
      logstash:
        condition: service_started
    command: ["python", "-c", "print('ueba-app ready')"]
    restart: "no"

  ueba-simulator:
    build:
      context: ..
      dockerfile: configs/Dockerfile.runtime
    container_name: ueba-simulator
    working_dir: /app
    volumes:
      - ..:/app
    command:
      - python
      - scripts/simulate_windows_realtime_logs.py
      - --send-logstash
      - --logstash-host
      - logstash
      - --logstash-port
      - "5000"
      - --output
      - data/sim/windows_realtime_events.jsonl
    networks:
      - ueba-network
    depends_on:
      logstash:
        condition: service_started
    profiles:
      - simulator
    restart: unless-stopped

networks:
  ueba-network:
    driver: bridge

volumes:
  elasticsearch-data:
    driver: local