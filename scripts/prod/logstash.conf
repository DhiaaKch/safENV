# ==============================================================================
# LOGSTASH PIPELINE - UEBA INSIDER THREAT DETECTION
# ==============================================================================
# Architecture:
#   - Input: JSON TCP (générateur), Syslog UDP, Beats
#   - Filters: Normalisation, enrichissement, séparation ground truth / ML
#   - Output: Elasticsearch (indices séparés events/predictions/errors)
# ==============================================================================

# ------------------------------------------------------------------------------
# INPUTS
# ------------------------------------------------------------------------------

input {
  # ============================================================================
  # INPUT 1: JSON TCP (Générateur Python principal)
  # ============================================================================
  # Usage: script Python envoie des événements JSON pré-formatés
  # Format attendu:
  # {
  #   "timestamp": "2024-01-15T14:30:00Z",
  #   "event_type": "logon|device|http|email|file",
  #   "user_id": "USR0001",
  #   "host": "WKS-0234",
  #   "action": "login|copy|browse|send",
  #   "source_ip": "192.168.1.45",
  #   "details": {...},
  #   "ground_truth": {"is_insider": true, "scenario": "data_theft"},
  #   "ml_prediction": {"is_insider_pred": true, "insider_score": 0.87}
  # }
  # ============================================================================
  tcp {
    port => 5000
    codec => json_lines
    tags => ["ueba_json_tcp"]
  }

  # ============================================================================
  # INPUT 2: Syslog UDP (Logs système optionnels)
  # ============================================================================
  # Usage: pour recevoir des logs Syslog classiques (serveurs Linux/Windows)
  # Format: RFC3164 ou RFC5424
  # ============================================================================
  udp {
    port => 5514
    codec => plain
    tags => ["syslog_udp"]
  }

  # ============================================================================
  # INPUT 3: Beats (Filebeat, Winlogbeat - optionnel, extension future)
  # ============================================================================
  # Usage: collecter logs depuis fichiers ou EventLog Windows
  # ============================================================================
  beats {
    port => 5044
    tags => ["beats"]
  }
}

# ------------------------------------------------------------------------------
# FILTERS
# ------------------------------------------------------------------------------

filter {
  # ============================================================================
  # FILTER 1: Traitement des événements JSON TCP (source principale)
  # ============================================================================
  if "ueba_json_tcp" in [tags] {
    
    # --------------------------------------------------------------------------
    # 1.1 Parsing timestamp
    # --------------------------------------------------------------------------
    # Normaliser le timestamp au format ISO8601 -> @timestamp
    if [@timestamp] {
      date {
        match => ["[@timestamp]", "ISO8601"]
        target => "@timestamp"
        timezone => "UTC"
      }
    } else if [timestamp] {
      date {
        match => ["timestamp", "ISO8601"]
        target => "@timestamp"
        timezone => "UTC"
      }
    }
    
    # --------------------------------------------------------------------------
    # 1.2 Ajout de métadonnées
    # --------------------------------------------------------------------------
    mutate {
      add_field => {
        # Par défaut: événement brut
        "[@metadata][index_type]" => "event"
        "[dataset]" => "ueba"
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "ueba.events"
      }
    }
    
    # --------------------------------------------------------------------------
    # 1.3 Extraction et séparation ground truth / ML prediction
    # --------------------------------------------------------------------------
    # Ground truth (label réel) -> champs dédiés
    if [ground_truth] {
      mutate {
        add_field => {
          "[label][is_insider]" => "%{[ground_truth][is_insider]}"
          "[label][scenario]" => "%{[ground_truth][scenario]}"
        }
      }
      # Supprimer le nested object pour aplatir (optionnel)
      # mutate { remove_field => ["ground_truth"] }
    }
    
    # ML prediction (sortie modèle) -> champs dédiés
    if [ml_prediction] {
      mutate {
        add_field => {
          "[ml][is_insider_pred]" => "%{[ml_prediction][is_insider_pred]}"
          "[ml][insider_score]" => "%{[ml_prediction][insider_score]}"
          "[ml][model_version]" => "%{[ml_prediction][model_version]}"
        }
      }
      # Conversion score en float
      mutate {
        convert => { "[ml][insider_score]" => "float" }
        convert => { "[ml][is_insider_pred]" => "boolean" }
      }
      
      # Marquer comme événement de prédiction si score existe
      if [ml][insider_score] {
        mutate {
          replace => { "[@metadata][index_type]" => "prediction" }
          replace => { "[data_stream][dataset]" => "ueba.predictions" }
        }
      }
    }
    
    # --------------------------------------------------------------------------
    # 1.4 Enrichissement user/host
    # --------------------------------------------------------------------------
    # Normaliser user_id
    if [user_id] {
      mutate {
        uppercase => ["user_id"]
        add_field => { "[user][id]" => "%{user_id}" }
      }
    } else if [user][name] {
      mutate {
        add_field => { "user_id" => "%{[user][name]}" }
      }
      mutate {
        uppercase => ["user_id"]
        add_field => { "[user][id]" => "%{user_id}" }
      }
    }
    
    # Normaliser host
    if [host] and ![host][name] {
      mutate {
        add_field => { "[host][name]" => "%{host}" }
      }
    }
    
    # Normaliser source IP
    if [source_ip] {
      mutate {
        add_field => { "[source][ip]" => "%{source_ip}" }
      }
    } else if [logon][source_ip] {
      mutate {
        add_field => { "[source][ip]" => "%{[logon][source_ip]}" }
      }
    }

    # Compatibilite simulateur ECS-like: reconstruire event_type si absent
    if ![event_type] and [event][category] {
      mutate {
        add_field => { "event_type" => "%{[event][category]}" }
      }
    }
    
    # --------------------------------------------------------------------------
    # 1.5 Catégorisation événement (ECS)
    # --------------------------------------------------------------------------
    # Mapper event_type vers ECS event.category
    if [event_type] == "logon" or [event_type] == "authentication" {
      mutate {
        add_field => { "[event][category]" => "authentication" }
        add_field => { "[event][action]" => "login" }
      }
    } else if [event_type] == "device" {
      mutate {
        add_field => { "[event][category]" => "device" }
        add_field => { "[event][action]" => "device_connect" }
      }
    } else if [event_type] == "http" {
      mutate {
        add_field => { "[event][category]" => "network" }
        add_field => { "[event][action]" => "http_request" }
      }
    } else if [event_type] == "email" {
      mutate {
        add_field => { "[event][category]" => "email" }
        add_field => { "[event][action]" => "email_send" }
      }
    } else if [event_type] == "file" {
      mutate {
        add_field => { "[event][category]" => "file" }
        add_field => { "[event][action]" => "file_copy" }
      }
    }
    
    # --------------------------------------------------------------------------
    # 1.6 Calcul de criticité (optionnel)
    # --------------------------------------------------------------------------
    # Si score ML > seuil, marquer comme "high" severity
    if [ml][insider_score] and [ml][insider_score] >= 0.70 {
      mutate {
        add_field => { "[event][severity]" => "high" }
        add_field => { "[event][risk_score]" => "%{[ml][insider_score]}" }
      }
      mutate {
        convert => { "[event][risk_score]" => "float" }
      }
    } else if [ml][insider_score] and [ml][insider_score] >= 0.40 {
      mutate {
        add_field => { "[event][severity]" => "medium" }
        add_field => { "[event][risk_score]" => "%{[ml][insider_score]}" }
      }
      mutate {
        convert => { "[event][risk_score]" => "float" }
      }
    } else if [ml][insider_score] {
      mutate {
        add_field => { "[event][severity]" => "low" }
        add_field => { "[event][risk_score]" => "%{[ml][insider_score]}" }
      }
      mutate {
        convert => { "[event][risk_score]" => "float" }
      }
    }
  }
  
  # ============================================================================
  # FILTER 2: Traitement des logs Syslog UDP
  # ============================================================================
  if "syslog_udp" in [tags] {
    
    # Parsing Syslog (RFC3164 ou RFC5424)
    grok {
      match => { "message" => "%{SYSLOGLINE}" }
    }
    
    # Parser timestamp Syslog
    date {
      match => ["timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss", "ISO8601"]
      target => "@timestamp"
    }
    
    # Métadonnées
    mutate {
      add_field => {
        "[@metadata][index_type]" => "event"
        "[dataset]" => "syslog"
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "syslog.system"
      }
    }
  }
  
  # ============================================================================
  # FILTER 3: Gestion des erreurs de parsing
  # ============================================================================
  # Si parsing JSON échoue ou champs manquants critiques -> index errors
  if "_jsonparsefailure" in [tags] or "_grokparsefailure" in [tags] {
    mutate {
      replace => { "[@metadata][index_type]" => "error" }
      replace => { "[data_stream][dataset]" => "ueba.errors" }
      add_field => { "[error][type]" => "parse_failure" }
    }
  }
  
  # ============================================================================
  # FILTER 4: Nettoyage final
  # ============================================================================
  # Supprimer champs inutiles
  mutate {
    # Déjà mappé vers @timestamp
    remove_field => ["timestamp"]
  }
}

# ------------------------------------------------------------------------------
# OUTPUTS
# ------------------------------------------------------------------------------

output {
  # ============================================================================
  # OUTPUT 1: Elasticsearch - Événements normaux
  # ============================================================================
  if [@metadata][index_type] == "event" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ueba-events-%{+YYYY.MM.dd}"
      # Template ECS (optionnel, pour mapping propre)
      # template_name => "ueba-events"
      # template => "/usr/share/logstash/templates/ueba-events.json"
    }
  }
  
  # ============================================================================
  # OUTPUT 2: Elasticsearch - Prédictions ML
  # ============================================================================
  if [@metadata][index_type] == "prediction" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ueba-predictions-%{+YYYY.MM.dd}"
    }
  }
  
  # ============================================================================
  # OUTPUT 3: Elasticsearch - Erreurs de parsing
  # ============================================================================
  if [@metadata][index_type] == "error" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "ueba-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # ============================================================================
  # OUTPUT 4: Stdout (debug - désactiver en production)
  # ============================================================================
  # Utile pour vérifier que Logstash reçoit bien les événements
  # stdout {
  #   codec => rubydebug
  # }
}